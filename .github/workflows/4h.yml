name: Send 4h Chart

on:
  workflow_dispatch:
  schedule:
    # 对应北京时间 8:00, 12:00, 16:00, 20:00, 0:00, 4:00
    - cron: '3 0,4,8,12,16,20 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install requests playwright && playwright install chromium
      - name: Run Script
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          TV_SYMBOL: 'BINANCE:BTCUSDT.P,BINANCE:ETHUSDT.P,BINANCE:SOLUSDT.P'
          TV_INTERVAL: '240'   # 👈 核心：告诉 Python 截取 4小时
        run: python main.py

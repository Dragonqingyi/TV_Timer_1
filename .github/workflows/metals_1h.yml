name: Send Metals 1h Chart
on:
  workflow_dispatch:
jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install Chinese Fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-wqy-zenhei
      - run: pip install requests playwright && playwright install chromium
      - name: Run Script
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_WEBHOOK: ${{ secrets.METALS_WEBHOOK }}   # 👈 贵金属群
          TV_SYMBOLS: 'BINANCE:XAUUSDT.P,BINANCE:XAGUSDT.P'
          TV_INTERVAL: '60'   # 👈 1小时
        run: python main.py
